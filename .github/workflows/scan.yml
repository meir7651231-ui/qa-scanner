# מריץ את סורק האיכות על רשימת אתרים (sites.txt) מהשרתים של GitHub - אינטרנט רגיל, בלי פרוקסי.
name: qa-scan
on:
  push:
    branches: [main]
  workflow_dispatch:        # כפתור "Run workflow" - הרצה ידנית, גם מהאפליקציה בטלפון
  # schedule:
  #   - cron: "0 6 * * 1"   # אפשר להפעיל ריצה שבועית אוטומטית
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python run_batch.py sites.txt
      - name: Save reports
        run: |
          git config user.name "qa-scanner"
          git config user.email "qa-scanner@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "QA scan $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do git push && exit 0; sleep $((2**i)); git pull --rebase; done
      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: reports/
