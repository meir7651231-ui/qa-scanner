<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Without qa-scanner a customer finds the zero price; with qa-scanner the scan finds it before launch">
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}</style>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b8f79"/></marker></defs>
<rect width="1280" height="340" rx="16" fill="#f6f8f8"/>
<g transform="translate(40,30)">
  <rect width="580" height="280" rx="14" fill="#fff6f6" stroke="#efc6c6"/>
  <text x="28" y="44" font-size="14" font-weight="700" fill="#c62828" letter-spacing="1.5">WITHOUT</text>
  <g font-size="16">
    <rect x="28" y="70" width="150" height="72" rx="10" fill="#fdeeee" stroke="#efc6c6"/><text x="103" y="100" text-anchor="middle" fill="#3a1c1c">you publish</text><text x="103" y="124" text-anchor="middle" fill="#c62828" class="mono">$0.00</text>
    <rect x="214" y="70" width="150" height="72" rx="10" fill="#fdeeee" stroke="#efc6c6"/><text x="289" y="100" text-anchor="middle" fill="#3a1c1c">a customer</text><text x="289" y="124" text-anchor="middle" fill="#3a1c1c">finds it</text>
    <rect x="400" y="70" width="150" height="72" rx="10" fill="#fdeeee" stroke="#efc6c6"/><text x="475" y="100" text-anchor="middle" fill="#3a1c1c">orders at 0,</text><text x="475" y="124" text-anchor="middle" fill="#3a1c1c">or complains</text>
  </g>
  <g stroke="#c62828" stroke-width="2" marker-end="url(#a1)"><line x1="180" y1="106" x2="208" y2="106"/><line x1="366" y1="106" x2="394" y2="106"/></g>
  <text x="28" y="196" font-size="17" fill="#6b3b3b">You hear about it last — after it cost money</text>
  <text x="28" y="224" font-size="17" fill="#6b3b3b">or trust.</text>
</g>
<g transform="translate(660,30)">
  <rect width="580" height="280" rx="14" fill="#ffffff" stroke="#0b8f79" stroke-opacity=".6"/>
  <text x="28" y="44" font-size="14" font-weight="700" fill="#0b8f79" letter-spacing="1.5">WITH QA-SCANNER</text>
  <g font-size="16">
    <rect x="28" y="70" width="150" height="72" rx="10" fill="#eef3f3" stroke="#d3dfde"/><text x="103" y="100" text-anchor="middle" fill="#0e1b1c">scan before</text><text x="103" y="124" text-anchor="middle" fill="#0e1b1c">launch</text>
    <rect x="214" y="70" width="150" height="72" rx="10" fill="#eef3f3" stroke="#d3dfde"/><text x="289" y="100" text-anchor="middle" fill="#c62828" class="mono">HIGH</text><text x="289" y="124" text-anchor="middle" fill="#0e1b1c">zero price</text>
    <rect x="400" y="70" width="150" height="72" rx="10" fill="#eef3f3" stroke="#d3dfde"/><text x="475" y="100" text-anchor="middle" fill="#0e1b1c">you fix it,</text><text x="475" y="124" text-anchor="middle" fill="#0e1b1c">then publish</text>
  </g>
  <g stroke="#0b8f79" stroke-width="2" marker-end="url(#a2)"><line x1="180" y1="106" x2="208" y2="106"/><line x1="366" y1="106" x2="394" y2="106"/></g>
  <text x="28" y="196" font-size="17" fill="#23393a">You hear about it first, in a report ranked</text>
  <text x="28" y="224" font-size="17" fill="#23393a">worst-first — and check it by eye.</text>
</g>
</svg>
